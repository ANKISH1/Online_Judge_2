version: '3.9'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env

    depends_on:
      - db
      - redis   

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: radiantoj
      POSTGRES_USER: radiantoj_user
      POSTGRES_PASSWORD: radiantoj_password
    volumes:
      - postgres_data:/var/lib/postgresql/data


  redis:
    image: redis:7-alpine     

  celery:
    build: .
    command: celery -A core worker --loglevel=info
    env_file:
      - .env
    depends_on:
      - db
      - redis 

volumes:
  postgres_data: